name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 || exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore was not found after creation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK ($EXPECTED_APK) does not exist."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Listing APK files found under app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK ($EXPECTED_APK) is empty."
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Expected file does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified debug APK: $EXPECTED_APK (Size: $(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TEMP_DIR"
          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="android-app"
          fi
          SANITIZED_NAME=$(echo "$RAW_NAME" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/^-//;s/-$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi
          ASSET_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="$TEMP_DIR/$ASSET_FILENAME"
          cp "$ORIGINAL_APK" "$ASSET_PATH"
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare non-empty release asset at $ASSET_PATH."
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset validation failed before release creation."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset does not have .apk extension."; exit 1 ;;
          esac
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<'EOF'
          ## Debug APK Build Notes
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - GitHub Actions run number: ${{ github.run_number }}
          - GitHub Actions run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF
          )
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          echo "=================================================="
          echo "           APK BUILD AND PUBLISH REPORT           "
          echo "=================================================="

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG" || true
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "")
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "- **Status**: Release published successfully"
              echo "- **Release Tag**: \`$TAG\`"
              if [ -n "$RELEASE_URL" ]; then
                echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              fi
              echo "- **Direct Download**: Available in the Assets section of the release (\`$ASSET_NAME\`)"
              echo "- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $PUBLISH_OUTCOME)."
            echo "The APK was successfully built and uploaded as a GitHub Actions artifact: app-debug-apk."

            {
              echo "### ⚠️ Debug APK Build Summary (Release Publishing Incomplete)"
              echo ""
              echo "- **Build Status**: APK build succeeded"
              echo "- **Artifact Upload**: Artifact \`app-debug-apk\` is available for download in this workflow run"
              echo "- **Release Publishing**: Release could not be created automatically; please download the APK from workflow run artifacts"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
